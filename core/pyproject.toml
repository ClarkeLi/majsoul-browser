[project]
name = "soul-core"
version = "0.1.0"
description = "雀魂浏览器 Majsoul-Browser 的 Python Core：协议解码、四麻状态机、Mortal 推理"
requires-python = ">=3.12,<3.13"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "protobuf>=5",
  # Intel Mac：PyTorch 2.2 之后不再提供 macOS x86_64 轮子，只能用 2.2.2（它又只兼容 numpy 1.x）
  "numpy>=2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "torch>=2.8; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pyyaml>=6",
  "libriichi",
  "mahjong>=1.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soul_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# 从 vendored 源码用 maturin 构建（需要 Rust 工具链）
libriichi = { path = "../vendor/mortal/libriichi" }
# Linux 上 PyPI 的 torch 默认带 CUDA（数 GB）；用 PyTorch 官方 CPU 源。macOS / Windows 的 PyPI 轮子本来就是 CPU 版
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
