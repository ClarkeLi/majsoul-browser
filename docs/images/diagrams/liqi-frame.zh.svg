<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Helvetica, Arial, sans-serif"><rect width="900" height="330" rx="14" fill="#ffffff"/><text x="30" y="36" font-size="18" font-weight="700" fill="#1d1b17">雀魂 WebSocket 二进制帧（liqi 协议）</text><text x="30" y="90" font-size="15" font-weight="800" fill="#3fb27b">Notify</text><rect x="130" y="64" width="70" height="40" fill="#e8f5ee" stroke="#1d1b17"/><text x="165.0" y="89" font-size="13" text-anchor="middle" fill="#1d1b17">0x01</text><rect x="200" y="64" width="630" height="40" fill="#f6f1e4" stroke="#1d1b17"/><text x="515.0" y="89" font-size="13" text-anchor="middle" fill="#1d1b17">BaseMessage { method_name, data }</text><text x="130" y="124" font-size="12" fill="#6b665b">服务端主动推送（ActionPrototype 等）。内层 data 再经 9 字节密钥 XOR 混淆</text><text x="30" y="176" font-size="15" font-weight="800" fill="#4f8fd0">Request</text><rect x="130" y="150" width="70" height="40" fill="#e6eef8" stroke="#1d1b17"/><text x="165.0" y="175" font-size="13" text-anchor="middle" fill="#1d1b17">0x02</text><rect x="200" y="150" width="140" height="40" fill="#e6eef8" stroke="#1d1b17"/><text x="270.0" y="175" font-size="13" text-anchor="middle" fill="#1d1b17">index (u16 LE)</text><rect x="340" y="150" width="490" height="40" fill="#f6f1e4" stroke="#1d1b17"/><text x="585.0" y="175" font-size="13" text-anchor="middle" fill="#1d1b17">BaseMessage { method_name, data }</text><text x="130" y="210" font-size="12" fill="#6b665b">客户端请求。记下 index → 方法名，等待配对</text><text x="30" y="262" font-size="15" font-weight="800" fill="#f0b43a">Response</text><rect x="130" y="236" width="70" height="40" fill="#fbf1dc" stroke="#1d1b17"/><text x="165.0" y="261" font-size="13" text-anchor="middle" fill="#1d1b17">0x03</text><rect x="200" y="236" width="140" height="40" fill="#fbf1dc" stroke="#1d1b17"/><text x="270.0" y="261" font-size="13" text-anchor="middle" fill="#1d1b17">index (u16 LE)</text><rect x="340" y="236" width="490" height="40" fill="#f6f1e4" stroke="#1d1b17"/><text x="585.0" y="261" font-size="13" text-anchor="middle" fill="#1d1b17">BaseMessage { data }</text><text x="130" y="296" font-size="12" fill="#6b665b">服务端响应。用 index 找回请求，从 liqi.json 查响应类型</text></svg>